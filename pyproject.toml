[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loglens"
version = "0.1.0"
description = "Local log analyzer with detection rules: SSH brute force, web scans, error spikes — zero dependencies, HTML reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ThorrijaDEV" }]
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
loglens = "loglens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]
